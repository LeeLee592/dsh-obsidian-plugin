# CI：push/PR 时执行类型检查与构建，作为发布前的质量门禁。
#
# 说明：
# - 依赖安装走 pnpm install --frozen-lockfile；peer deps（cordis / dsh-tools /
#   schemastery）由 autoInstallPeers 从 lockfile 解析，无需额外补装。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
